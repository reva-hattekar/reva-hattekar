<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 230" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0a0d12" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="50%" stop-color="#79c0ff" />
      <stop offset="100%" stop-color="#a5d6ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#30363d" stroke-width="0.5" stroke-opacity="0.4" />
    </pattern>
    <style>
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes pulse {
        0% { transform: scale(0.95); opacity: 0.7; }
        50% { transform: scale(1.15); opacity: 1; filter: drop-shadow(0 0 6px #3fb950); }
        100% { transform: scale(0.95); opacity: 0.7; }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-5px) rotate(3deg); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(4px) rotate(-3deg); }
      }
      .cursor {
        animation: blink 1s infinite;
      }
      .pulse-dot {
        transform-origin: center;
        animation: pulse 2.5s infinite ease-in-out;
      }
      .float-1 {
        animation: floatSlow 4s infinite ease-in-out;
        transform-origin: 780px 70px;
      }
      .float-2 {
        animation: floatReverse 5s infinite ease-in-out;
        transform-origin: 740px 150px;
      }
      .font-mono {
        font-family: ui-monospace, "Cascadia Code", "Source Code Pro", Menlo, Consolas, "DejaVu Sans Mono", monospace;
      }
      .font-sans {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      }
    </style>
  </defs>

  <!-- Base Card -->
  <rect x="2" y="2" width="876" height="226" rx="16" fill="url(#bgGrad)" stroke="#30363d" stroke-width="1.5" />
  
  <!-- Subtle Grid Pattern -->
  <rect x="3" y="3" width="874" height="224" rx="15" fill="url(#grid)" />

  <!-- Window Header Bar -->
  <rect x="2" y="2" width="876" height="38" rx="16" fill="#161b22" fill-opacity="0.8" />
  <path d="M 2 40 L 878 40" stroke="#30363d" stroke-width="1" />

  <!-- Window Controls -->
  <circle cx="24" cy="21" r="5.5" fill="#ff5f56" />
  <circle cx="42" cy="21" r="5.5" fill="#ffbd2e" />
  <circle cx="60" cy="21" r="5.5" fill="#27c93f" />

  <!-- Window Title / Status Pill -->
  <rect x="650" y="10" width="206" height="22" rx="11" fill="#0d1117" stroke="#30363d" stroke-width="1" />
  <circle cx="666" cy="21" r="4" fill="#3fb950" class="pulse-dot" />
  <text x="678" y="25" fill="#8b949e" font-size="11" font-weight="500" class="font-mono">workshop / online</text>

  <!-- Left Accent / Decorative Corner Tag -->
  <text x="90" y="25" fill="#8b949e" font-size="11" font-weight="500" class="font-mono">reva.workspace ~ v2.6</text>

  <!-- Main Hero Content -->
  <!-- Name Heading -->
  <text x="40" y="105" fill="url(#textGrad)" font-size="46" font-weight="800" letter-spacing="-1" class="font-sans" filter="url(#glow)">Reva</text>
  
  <!-- Subtitle / Role Badge -->
  <g transform="translate(195, 75)">
    <rect x="0" y="0" width="280" height="30" rx="8" fill="#1f242c" stroke="#384252" stroke-width="1" />
    <text x="14" y="19" fill="#e6edf3" font-size="13" font-weight="600" class="font-mono">student · builder · creative</text>
  </g>

  <!-- Dynamic Typing Prompt -->
  <g transform="translate(40, 140)">
    <rect x="0" y="0" width="550" height="42" rx="10" fill="#0d1117" stroke="#21262d" stroke-width="1.2" />
    <text x="18" y="26" fill="#3fb950" font-size="15" font-weight="700" class="font-mono">&gt;</text>
    <text x="36" y="26" fill="#e6edf3" font-size="14" font-weight="500" class="font-mono">coding / editing / dancing / tinkering</text>
    <rect x="365" y="12" width="8" height="18" fill="#58a6ff" class="cursor" />
  </g>

  <!-- Subtle Bottom Note -->
  <text x="42" y="206" fill="#8b949e" font-size="11.5" font-weight="400" class="font-mono">making things because exploring ideas is what makes life interesting.</text>

  <!-- Right Decorative Scrapbook / Atelier Elements -->
  <g class="float-1">
    <!-- Mini Hardware / Circuit Stamp -->
    <rect x="655" y="58" width="180" height="66" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.2" />
    <path d="M 670 78 L 700 78 L 710 95 L 740 95" stroke="#f0883e" stroke-width="1.5" fill="none" stroke-dasharray="3 2" />
    <circle cx="670" cy="78" r="3" fill="#f0883e" />
    <circle cx="740" cy="95" r="3" fill="#f0883e" />
    <rect x="750" y="72" width="20" height="20" rx="3" fill="#21262d" stroke="#58a6ff" stroke-width="1" />
    <text x="755" y="86" fill="#58a6ff" font-size="10" font-weight="700" class="font-mono">μC</text>
    <text x="670" y="112" fill="#8b949e" font-size="10" class="font-mono">MOD: ESP32 + ROS + UI</text>
  </g>

  <g class="float-2">
    <!-- Creative Edit Stamp -->
    <rect x="685" y="136" width="150" height="54" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.2" />
    <text x="702" y="158" fill="#bc8cff" font-size="12" font-weight="600" class="font-mono">✦ visual craft</text>
    <text x="702" y="176" fill="#8b949e" font-size="10.5" class="font-mono">frame by frame</text>
    <circle cx="815" cy="163" r="6" fill="#bc8cff" fill-opacity="0.2" stroke="#bc8cff" stroke-width="1" />
  </g>

</svg>
