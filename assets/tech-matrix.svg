      <rect x="102" y="0" width="66" height="22" rx="5" fill="#1b222d" stroke="#30363d" stroke-width="1" />
      <text x="10" y="15" fill="#e6edf3" class="font-mono pill-text">Firebase</text>
    </g>

    <g transform="translate(14, 70)">
      <rect x="0" y="0" width="70" height="22" rx="5" fill="#1b222d" stroke="#30363d" stroke-width="1" />
      <text x="10" y="15" fill="#e6edf3" class="font-mono pill-text">Firestore</text>

      <rect x="78" y="0" width="48" height="22" rx="5" fill="#1b222d" stroke="#30363d" stroke-width="1" />
      <text x="8" y="15" fill="#e6edf3" class="font-mono pill-text">SQL</text>

      <rect x="134" y="0" width="40" height="22" rx="5" fill="#1b222d" stroke="#30363d" stroke-width="1" />
      <text x="8" y="15" fill="#e6edf3" class="font-mono pill-text">GIS</text>
    </g>

    <g transform="translate(14, 98)">
      <rect x="0" y="0" width="168" height="22" rx="5" fill="#1b222d" stroke="#30363d" stroke-width="1" />
      <text x="8" y="15" fill="#8b949e" class="font-mono pill-text">Render · Vercel · Mapbox</text>
