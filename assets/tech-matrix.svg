      <text x="8" y="15" fill="#e6edf3" class="font-mono pill-text">Dancing</text>
    </g>

    <g transform="translate(14, 70)">
      <rect x="0" y="0" width="168" height="22" rx="5" fill="#1b222d" stroke="#30363d" stroke-width="1" />
      <text x="8" y="15" fill="#e6edf3" class="font-mono pill-text">Visual Storytelling &amp; Cut</text>
    </g>

    <g transform="translate(14, 98)">
      <rect x="0" y="0" width="168" height="22" rx="5" fill="#1b222d" stroke="#30363d" stroke-width="1" />
      <text x="8" y="15" fill="#8b949e" class="font-mono pill-text">UI Motion &amp; Prototyping</text>
