<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 28" width="100%" height="28">
  <defs>
    <linearGradient id="divGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#30363d" stop-opacity="0.1" />
      <stop offset="30%" stop-color="#30363d" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#58a6ff" stop-opacity="1" />
      <stop offset="70%" stop-color="#30363d" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#30363d" stop-opacity="0.1" />
    </linearGradient>
    <style>
      @keyframes glowPulse {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.2); opacity: 1; filter: drop-shadow(0 0 6px #58a6ff); }
      }
      .center-gem {
        transform-origin: 440px 14px;
        animation: glowPulse 3s infinite ease-in-out;
      }
    </style>
  </defs>
  <line x1="20" y1="14" x2="410" y2="14" stroke="url(#divGrad)" stroke-width="1.5" stroke-dasharray="6 4" />
  <g class="center-gem">
    <rect x="432" y="6" width="16" height="16" rx="3" transform="rotate(45 440 14)" fill="#161b22" stroke="#58a6ff" stroke-width="1.5" />
    <circle cx="440" cy="14" r="3" fill="#79c0ff" />
  </g>
  <line x1="470" y1="14" x2="860" y2="14" stroke="url(#divGrad)" stroke-width="1.5" stroke-dasharray="6 4" />
</svg>
