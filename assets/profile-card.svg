<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 370" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080a0f" />
      <stop offset="60%" stop-color="#0e131d" />
      <stop offset="100%" stop-color="#06080c" />
    </linearGradient>
    <linearGradient id="irisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="50%" stop-color="#00bbf9" />
      <stop offset="100%" stop-color="#7b2cbf" />
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3366" />
      <stop offset="100%" stop-color="#ff758c" />
    </linearGradient>
    <filter id="cyanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="pinkGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes eyeBlink {
        0%, 88%, 100% { transform: scaleY(1); }
        93% { transform: scaleY(0.08); }
      }
      @keyframes pupilTrack {
        0%, 30%, 100% { transform: translate(0px, 0px); }
        38%, 60% { transform: translate(7px, -3px); }
        68%, 85% { transform: translate(-6px, 2px); }
      }
      @keyframes ringSpin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes ringReverse {
        0% { transform: rotate(360deg); }
        100% { transform: rotate(0deg); }
      }
      @keyframes pulseLive {
        0%, 100% { opacity: 0.6; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.2); filter: drop-shadow(0 0 5px #00f5d4); }
      }
      @keyframes cursorBlink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }

      .eyelid-group {
        transform-origin: 135px 125px;
        animation: eyeBlink 3.8s infinite ease-in-out;
      }
      .pupil-track {
        animation: pupilTrack 7.5s infinite ease-in-out;
      }
      .tech-ring-1 {
        transform-origin: 135px 125px;
        animation: ringSpin 20s linear infinite;
      }
      .tech-ring-2 {
        transform-origin: 135px 125px;
        animation: ringReverse 14s linear infinite;
      }
      .status-pulse {
        transform-origin: 846px 25px;
        animation: pulseLive 2.4s infinite ease-in-out;
      }
      .cursor-blink {
        animation: cursorBlink 1s infinite;
      }

      .font-mono { font-family: "JetBrains Mono", "Fira Code", ui-monospace, Menlo, Consolas, monospace; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
  </defs>

  <!-- Base Outer Shell -->
  <rect x="2" y="2" width="876" height="366" rx="14" fill="url(#bgGradient)" stroke="#232b3b" stroke-width="1.5" />

  <!-- Corner Alignment Crosshairs -->
  <path d="M 14 10 L 14 18 M 10 14 L 18 14" stroke="#ff3366" stroke-width="1.5" />
  <path d="M 866 10 L 866 18 M 862 14 L 870 14" stroke="#ff3366" stroke-width="1.5" />
  <path d="M 14 352 L 14 360 M 10 356 L 18 356" stroke="#ff3366" stroke-width="1.5" />
  <path d="M 866 352 L 866 360 M 862 356 L 870 356" stroke="#ff3366" stroke-width="1.5" />

  <!-- Top System Header Bar -->
  <text x="32" y="29" fill="#586578" font-size="11" font-weight="600" class="font-mono">REVA // TERMINAL_PROFILE</text>
  <text x="210" y="29" fill="#3a4556" font-size="11" class="font-mono">[0x7E · EMBEDDED · ML · SYSTEMS]</text>
  
  <circle cx="846" cy="25" r="3.5" fill="#00f5d4" class="status-pulse" />
  <text x="784" y="29" fill="#00f5d4" font-size="10.5" font-weight="700" class="font-mono">ONLINE</text>

  <!-- Horizontal Tech Divider -->
  <line x1="20" y1="40" x2="860" y2="40" stroke="#1d2433" stroke-width="1" stroke-dasharray="4 3" />

  <!-- Vertical Divider Splitting Left (Identity/Eye) and Right (Stack & Builds) -->
  <line x1="270" y1="48" x2="270" y2="352" stroke="#1d2433" stroke-width="1" stroke-dasharray="3 3" />

  <!-- ================================================================= -->
  <!-- LEFT COLUMN: ROBOT EYE MOTIF & PERSONAL IDENTITY -->
  <!-- ================================================================= -->
  <g transform="translate(0, 0)">
    
    <!-- Outer Mechanical HUD Rings for Robot Eye -->
    <circle cx="135" cy="125" r="68" fill="#05070a" stroke="#1c2331" stroke-width="1.5" />
    <circle cx="135" cy="125" r="62" fill="none" stroke="#2a3547" stroke-width="1" stroke-dasharray="4 6" class="tech-ring-1" />
    <circle cx="135" cy="125" r="54" fill="none" stroke="#ff3366" stroke-width="0.8" stroke-opacity="0.4" stroke-dasharray="8 12" class="tech-ring-2" />

    <!-- Eye Frame Aperture -->
    <g class="eyelid-group">
      <!-- Sclera / Base Eye Chamber -->
      <path d="M 88 125 Q 135 88 182 125 Q 135 162 88 125 Z" fill="#0c1017" stroke="#3b485d" stroke-width="1.8" />
      
      <!-- Inner Pupil / Iris Movement -->
      <g class="pupil-track">
        <!-- Outer Glowing Iris Ring -->
        <circle cx="135" cy="125" r="22" fill="url(#irisGrad)" filter="url(#cyanGlow)" />
        
        <!-- Tech Iris Details -->
        <circle cx="135" cy="125" r="14" fill="#06080d" stroke="#00f5d4" stroke-width="1.2" />
        
        <!-- Core Pupil -->
        <circle cx="135" cy="125" r="6" fill="#00f5d4" />
        <circle cx="138" cy="122" r="2" fill="#ffffff" />
        
        <!-- Reticle Crosshair Inside Eye -->
        <line x1="135" y1="107" x2="135" y2="111" stroke="#00f5d4" stroke-width="1.5" />
        <line x1="135" y1="139" x2="135" y2="143" stroke="#00f5d4" stroke-width="1.5" />
        <line x1="117" y1="125" x2="121" y2="125" stroke="#00f5d4" stroke-width="1.5" />
        <line x1="149" y1="125" x2="153" y2="125" stroke="#00f5d4" stroke-width="1.5" />
      </g>
    </g>

    <!-- Eye Annotation Ticks -->
    <text x="135" y="210" fill="#586578" font-size="9" font-weight="600" text-anchor="middle" class="font-mono">MOTIF // SENSOR_SYS.01</text>

    <!-- Identity & Intro -->
    <text x="135" y="246" fill="#f0f6fc" font-size="28" font-weight="900" letter-spacing="-0.5" text-anchor="middle" class="font-sans">Reva</text>
    <text x="135" y="268" fill="#ff3366" font-size="11" font-weight="700" text-anchor="middle" class="font-mono">student · developer · builder</text>

    <!-- Micro Statement -->
    <text x="135" y="304" fill="#8b949e" font-size="11" text-anchor="middle" class="font-sans">I build on-device ML,</text>
    <text x="135" y="322" fill="#8b949e" font-size="11" text-anchor="middle" class="font-sans">embedded systems &amp; software.</text>
    <text x="135" y="340" fill="#586578" font-size="10" text-anchor="middle" class="font-mono">github.com/reva-hattekar</text>
  </g>

  <!-- ================================================================= -->
  <!-- RIGHT COLUMN: CURATED STACK + EXPLORATIONS & BUILDS -->
  <!-- ================================================================= -->
  <g transform="translate(294, 52)">

    <!-- SECTION 1: CURATED CORE STACK -->
    <text x="0" y="16" fill="#ff3366" font-size="10.5" font-weight="800" class="font-mono">[01] CORE STACK</text>
    
    <g transform="translate(0, 30)">
      <!-- Languages -->
      <text x="0" y="12" fill="#6e7681" font-size="10.5" font-weight="600" class="font-mono">LANGUAGES   :</text>
      <text x="100" y="12" fill="#e6edf3" font-size="11" font-weight="500" class="font-mono"><tspan fill="#00f5d4">Python</tspan> · <tspan fill="#e6edf3">C / C++</tspan> · <tspan fill="#e6edf3">Java</tspan> · <tspan fill="#e6edf3">Dart</tspan> · <tspan fill="#e6edf3">SQL</tspan></text>

      <!-- ML & Intelligence -->
      <text x="0" y="34" fill="#6e7681" font-size="10.5" font-weight="600" class="font-mono">ML &amp; VISION :</text>
      <text x="100" y="34" fill="#e6edf3" font-size="11" font-weight="500" class="font-mono"><tspan fill="#00f5d4">TensorFlow / TFLite</tspan> · <tspan fill="#e6edf3">Google ML Kit</tspan> · <tspan fill="#8b949e">MobileNetV2</tspan></text>

      <!-- Hardware & Embedded -->
      <text x="0" y="56" fill="#6e7681" font-size="10.5" font-weight="600" class="font-mono">HARDWARE    :</text>
      <text x="100" y="56" fill="#e6edf3" font-size="11" font-weight="500" class="font-mono"><tspan fill="#00f5d4">ESP32</tspan> · <tspan fill="#e6edf3">Raspberry Pi</tspan> · <tspan fill="#e6edf3">Arduino</tspan> · <tspan fill="#8b949e">Sensors &amp; BLE</tspan></text>

      <!-- Apps & Systems -->
      <text x="0" y="78" fill="#6e7681" font-size="10.5" font-weight="600" class="font-mono">SYSTEMS/APPS:</text>
      <text x="100" y="78" fill="#e6edf3" font-size="11" font-weight="500" class="font-mono"><tspan fill="#00f5d4">Flutter</tspan> · <tspan fill="#e6edf3">React</tspan> · <tspan fill="#e6edf3">Node.js</tspan> · <tspan fill="#e6edf3">Firebase</tspan> · <tspan fill="#8b949e">Linux</tspan></text>
    </g>

    <!-- Micro Line Divider -->
    <line x1="0" y1="124" x2="550" y2="124" stroke="#1d2433" stroke-width="1" stroke-dasharray="3 3" />

    <!-- SECTION 2: WHAT I BUILD (CONTEXT & PROTOTYPES) -->
    <text x="0" y="146" fill="#00f5d4" font-size="10.5" font-weight="800" class="font-mono">[02] WHAT I BUILD // PROTOTYPES &amp; SYSTEMS</text>

    <g transform="translate(0, 160)">
      <!-- Item 1: Glance -->
      <text x="0" y="12" fill="#ff758c" font-size="11" font-weight="700" class="font-mono">⚡ Glance</text>
      <text x="96" y="12" fill="#8b949e" font-size="11" class="font-mono">Smart glasses ML detection + ESP32 ToF laser node</text>

      <!-- Item 2: Companion Robot -->
      <text x="0" y="32" fill="#ff758c" font-size="11" font-weight="700" class="font-mono">🤖 Robot</text>
      <text x="96" y="32" fill="#8b949e" font-size="11" class="font-mono">Interactive desk robot w/ sensors &amp; OLED eye animations</text>

      <!-- Item 3: Smart Mirror -->
      <text x="0" y="52" fill="#ff758c" font-size="11" font-weight="700" class="font-mono">🪞 Mirror</text>
      <text x="96" y="52" fill="#8b949e" font-size="11" class="font-mono">Linux/Pi vision display <tspan fill="#ff3366">[Top 20 @ IIT Bombay Techfest]</tspan></text>

      <!-- Item 4: Smart City Safety -->
      <text x="0" y="72" fill="#ff758c" font-size="11" font-weight="700" class="font-mono">🗺️ City GIS</text>
      <text x="96" y="72" fill="#8b949e" font-size="11" class="font-mono">Dynamic dark-zone safety mapping &amp; municipal risk triage</text>
    </g>

    <!-- Bottom Status Line -->
    <g transform="translate(0, 272)">
      <text x="0" y="12" fill="#586578" font-size="10.5" class="font-mono">&gt; status: prototyping physical &amp; spatial ideas</text>
      <rect x="330" y="2" width="6" height="12" fill="#00f5d4" class="cursor-blink" />
    </g>

  </g>

</svg>
