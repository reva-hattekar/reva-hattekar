<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 180" width="100%" height="100%">
  <defs>
    <linearGradient id="taraBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121820" />
      <stop offset="100%" stop-color="#0b0e14" />
    </linearGradient>
    <style>
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes nodePing {
        0%, 100% { r: 3; opacity: 0.6; }
        50% { r: 6; opacity: 1; filter: drop-shadow(0 0 4px #3fb950); }
      }
      @keyframes darkZonePulse {
        0%, 100% { r: 12; opacity: 0.3; }
        50% { r: 18; opacity: 0.7; filter: drop-shadow(0 0 8px #f85149); }
      }
      .radar-sweep {
        transform-origin: 114px 89px;
        animation: radarSweep 6s linear infinite;
      }
      .safe-node {
        animation: nodePing 2.5s infinite ease-in-out;
      }
      .dark-node {
        animation: darkZonePulse 2s infinite ease-in-out;
      }
      .font-mono { font-family: ui-monospace, "Cascadia Code", Menlo, monospace; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    </style>
  </defs>

  <!-- Container Box -->
  <rect x="2" y="2" width="876" height="176" rx="14" fill="url(#taraBg)" stroke="#263040" stroke-width="1.2" />

  <!-- Left: GIS Dynamic Dark-Zone & Radar Display -->
  <rect x="26" y="24" width="176" height="130" rx="12" fill="#06090e" stroke="#374558" stroke-width="1.5" />
  
  <!-- Radar Rings -->
  <circle cx="114" cy="89" r="54" fill="none" stroke="#21262d" stroke-width="1" />
  <circle cx="114" cy="89" r="36" fill="none" stroke="#21262d" stroke-width="1" />
  <circle cx="114" cy="89" r="18" fill="none" stroke="#21262d" stroke-width="1" />
  
  <!-- Crosshairs -->
  <line x1="114" y1="35" x2="114" y2="143" stroke="#21262d" stroke-width="0.8" />
  <line x1="60" y1="89" x2="168" y2="89" stroke="#21262d" stroke-width="0.8" />

  <!-- Road Network Polyline Geometry Simulation -->
  <path d="M 75 125 L 105 95 L 114 89 L 145 65 L 155 45" stroke="#30363d" stroke-width="2" fill="none" />
  <path d="M 68 80 L 105 95 L 140 120" stroke="#30363d" stroke-width="1.5" fill="none" stroke-dasharray="3 2" />

  <!-- Dark Zone Alert Cluster -->
  <circle cx="145" cy="65" r="14" fill="#f85149" fill-opacity="0.2" class="dark-node" />
  <circle cx="145" cy="65" r="4" fill="#f85149" />

  <!-- Safe Corridor Nodes -->
  <circle cx="75" cy="125" r="3.5" fill="#3fb950" class="safe-node" />
  <circle cx="105" cy="95" r="3.5" fill="#3fb950" class="safe-node" />
  <circle cx="114" cy="89" r="4" fill="#58a6ff" />

  <!-- Rotating Radar Beam -->
  <g class="radar-sweep">
    <line x1="114" y1="89" x2="168" y2="89" stroke="#3fb950" stroke-width="1.5" stroke-opacity="0.8" />
    <path d="M 114 89 L 168 89 A 54 54 0 0 0 152 52 Z" fill="#3fb950" fill-opacity="0.15" />
  </g>

  <text x="36" y="142" fill="#8b949e" font-size="8" class="font-mono">GIS: 28.6139° N / 77.2090° E</text>

  <!-- Middle & Right: Project Narrative & Architecture -->
  <g transform="translate(230, 24)">
    <!-- Category & Status Badge -->
    <rect x="0" y="0" width="102" height="22" rx="6" fill="#1b2a1e" stroke="#2c5c32" stroke-width="1" />
    <text x="8" y="15" fill="#56d364" font-size="11" font-weight="700" class="font-mono">GIS &amp; SPATIAL</text>
    
    <text x="114" y="16" fill="#8b949e" font-size="11" class="font-mono">PROJECT_ID // 03 · URBAN RESILIENCE</text>

    <!-- Title -->
    <text x="0" y="48" fill="#f0f6fc" font-size="20" font-weight="700" class="font-sans">Smart City Safety Mapper (TARA)</text>

    <!-- Description -->
    <text x="0" y="74" fill="#8b949e" font-size="13" class="font-sans">Dynamic spatial safety system modeling infrastructure dark-zones, lighting exposure,</text>
    <text x="0" y="93" fill="#8b949e" font-size="13" class="font-sans">pedestrian footfall gravity, and crowd-sourced civic incident prioritization.</text>

    <!-- Tech Pills -->
    <g transform="translate(0, 110)">
      <rect x="0" y="0" width="94" height="22" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <text x="10" y="15" fill="#e6edf3" font-size="11" class="font-mono">Flutter App</text>

      <rect x="102" y="0" width="128" height="22" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <text x="112" y="15" fill="#e6edf3" font-size="11" class="font-mono">React Dashboard</text>

      <rect x="238" y="0" width="115" height="22" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <text x="248" y="15" fill="#e6edf3" font-size="11" class="font-mono">Render Cloud</text>

      <rect x="361" y="0" width="85" height="22" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <text x="371" y="15" fill="#e6edf3" font-size="11" class="font-mono">Firestore</text>

      <rect x="454" y="0" width="144" height="22" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <text x="464" y="15" fill="#e6edf3" font-size="11" class="font-mono">Spatial Risk Engine</text>
    </g>
  </g>
</svg>
