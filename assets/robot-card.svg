<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 180" width="100%" height="100%">
  <defs>
    <linearGradient id="robotBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121820" />
      <stop offset="100%" stop-color="#0b0e14" />
    </linearGradient>
    <linearGradient id="oledGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      @keyframes blinkEye {
        0%, 90%, 100% { transform: scaleY(1); }
        95% { transform: scaleY(0.1); }
      }
      @keyframes lookAround {
        0%, 35%, 100% { transform: translate(0px, 0px); }
        40%, 65% { transform: translate(6px, -2px); }
        70%, 85% { transform: translate(-5px, 2px); }
      }
      @keyframes antennaPulse {
        0%, 100% { fill: #f0883e; filter: drop-shadow(0 0 2px #f0883e); }
        50% { fill: #ffa657; filter: drop-shadow(0 0 8px #ffa657); }
      }
      .oled-eye-l {
        transform-origin: 90px 92px;
        animation: blinkEye 4s infinite, lookAround 8s infinite ease-in-out;
      }
      .oled-eye-r {
        transform-origin: 140px 92px;
        animation: blinkEye 4s infinite, lookAround 8s infinite ease-in-out;
      }
      .antenna-tip {
        animation: antennaPulse 2s infinite ease-in-out;
      }
      .font-mono { font-family: ui-monospace, "Cascadia Code", Menlo, monospace; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    </style>
  </defs>

  <!-- Container Box -->
  <rect x="2" y="2" width="876" height="176" rx="14" fill="url(#robotBg)" stroke="#263040" stroke-width="1.2" />

  <!-- Left: OLED & Robot Hardware Silhouette -->
  <!-- Robot Body Case -->
  <rect x="26" y="24" width="176" height="130" rx="20" fill="#1b222d" stroke="#374558" stroke-width="1.5" />
  
  <!-- Antenna -->
  <line x1="114" y1="24" x2="114" y2="10" stroke="#48586f" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="114" cy="8" r="4.5" class="antenna-tip" />

  <!-- OLED Bezel & Screen -->
  <rect x="42" y="44" width="144" height="90" rx="10" fill="#05080c" stroke="#1f2937" stroke-width="2" />
  
  <!-- Subtle screen grid scanlines -->
  <line x1="44" y1="65" x2="184" y2="65" stroke="#00f2fe" stroke-width="0.3" stroke-opacity="0.2" />
  <line x1="44" y1="85" x2="184" y2="85" stroke="#00f2fe" stroke-width="0.3" stroke-opacity="0.2" />
  <line x1="44" y1="105" x2="184" y2="105" stroke="#00f2fe" stroke-width="0.3" stroke-opacity="0.2" />

  <!-- Animated Expressive OLED Eyes -->
  <g filter="url(#cyanGlow)">
    <!-- Left Eye -->
    <rect class="oled-eye-l" x="72" y="74" width="34" height="34" rx="8" fill="#00f2fe" />
    <!-- Right Eye -->
    <rect class="oled-eye-r" x="124" y="74" width="34" height="34" rx="8" fill="#00f2fe" />
  </g>

  <!-- Middle & Right: Project Narrative & Architecture -->
  <g transform="translate(230, 24)">
    <!-- Category & Badge -->
    <rect x="0" y="0" width="82" height="22" rx="6" fill="#1b2b3a" stroke="#255a80" stroke-width="1" />
    <text x="8" y="15" fill="#58a6ff" font-size="11" font-weight="700" class="font-mono">HARDWARE</text>
    
    <text x="96" y="16" fill="#8b949e" font-size="11" class="font-mono">PROJECT_ID // 01 · DESK ROBOTICS</text>

    <!-- Title -->
    <text x="0" y="48" fill="#f0f6fc" font-size="20" font-weight="700" class="font-sans">Companion / Desk Robot</text>

    <!-- Description -->
    <text x="0" y="74" fill="#8b949e" font-size="13" class="font-sans">Interactive physical desk companion combining custom embedded hardware,</text>
    <text x="0" y="93" fill="#8b949e" font-size="13" class="font-sans">sensor suites, expressive OLED facial animations, and tactile responsiveness.</text>

    <!-- Tech Pills -->
    <g transform="translate(0, 110)">
      <rect x="0" y="0" width="70" height="22" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <text x="10" y="15" fill="#e6edf3" font-size="11" class="font-mono">ESP32</text>

      <rect x="78" y="0" width="105" height="22" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <text x="88" y="15" fill="#e6edf3" font-size="11" class="font-mono">I2C OLED UI</text>

      <rect x="191" y="0" width="102" height="22" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <text x="201" y="15" fill="#e6edf3" font-size="11" class="font-mono">IMU &amp; Touch</text>

      <rect x="301" y="0" width="138" height="22" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <text x="311" y="15" fill="#e6edf3" font-size="11" class="font-mono">Expressive Motion</text>

      <rect x="447" y="0" width="148" height="22" rx="6" fill="#1c2419" stroke="#2e6425" stroke-width="1" />
      <text x="457" y="15" fill="#3fb950" font-size="11" font-weight="600" class="font-mono">● physical prototype</text>
    </g>
  </g>
</svg>
